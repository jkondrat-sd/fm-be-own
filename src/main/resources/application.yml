# ============================================================
# FM-BE — Shared Configuration (all profiles)
# ============================================================
spring:
  application:
    name: fm-be
  main:
    banner-mode: off

  # --- Database (PostgreSQL 16 + PostGIS 3.4) ---
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fm_db}
    username: ${DATABASE_USERNAME:user}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        format_sql: false
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  # --- Flyway Database Migrations ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # --- Redis ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000

  # --- Jackson (JSON serialization) ---
  jackson:
    date-format: com.fasterxml.jackson.databind.util.StdDateFormat
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

# --- Server ---
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# --- JWT Configuration ---
app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production-must-be-at-least-256-bits-long-for-hs256}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}       # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}   # 7 days (web)
    mobile-refresh-expiration-ms: ${JWT_MOBILE_REFRESH_EXPIRATION:2592000000}  # 30 days (mobile)

  # --- CORS ---
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

  # --- Storage (R2/S3-compatible) ---
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    bucket-name: ${STORAGE_BUCKET:fm-media}
    region: ${STORAGE_REGION:auto}
    presigned-url-expiration-minutes: 15

  # --- FCM (Firebase Cloud Messaging) ---
  fcm:
    enabled: ${FCM_ENABLED:false}
    credentials-path: ${FCM_CREDENTIALS_PATH:}

  # --- Async Thread Pool ---
  async:
    core-pool-size: ${ASYNC_CORE_POOL:2}
    max-pool-size: ${ASYNC_MAX_POOL:4}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:50}

  # --- PII Encryption (Aadhaar, PAN) ---
  encryption:
    pii-key: ${PII_ENCRYPTION_KEY:}

  # --- Rate Limiting ---
  rate-limit:
    otp-requests-per-minute: 5
    location-updates-per-10s: 1
    default-requests-per-minute: 100

# --- Springdoc OpenAPI ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
