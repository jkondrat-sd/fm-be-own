# ============================================================
# FM-BE — Production Profile
# ============================================================
spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: false
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 500

  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

# --- Logging (structured JSON in prod via logback-spring.xml) ---
logging:
  level:
    root: WARN
    com.fm.be: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.flywaydb: INFO

# --- Server ---
server:
  tomcat:
    max-threads: 200
    min-spare-threads: 20
    accept-count: 100
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024
  shutdown: graceful

# --- Actuator (restricted in prod) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# --- Springdoc (disable in prod unless needed) ---
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# --- Production overrides (all from env vars) ---
app:
  fcm:
    enabled: true
