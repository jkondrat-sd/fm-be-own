# ============================================================
# FM-BE — Production Profile
# ============================================================
spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

  jpa:
    hibernate:
      ddl-auto: validate   # NEVER auto-DDL in production
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false

# --- Logging ---
logging:
  level:
    root: WARN
    com.fm.be: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

# --- Production overrides (all from env vars) ---
app:
  fcm:
    enabled: true
