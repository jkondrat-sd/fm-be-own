# ============================================================
# FM-BE — Development Profile
# ============================================================
spring:
  jpa:
    hibernate:
      ddl-auto: update   # Allow auto-DDL in dev for rapid prototyping
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false        # Disable in dev when using ddl-auto: update

  data:
    redis:
      host: localhost
      port: 6379

# --- Logging ---
logging:
  level:
    root: INFO
    com.fm.be: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG

# --- Dev JWT (short secret ok for local) ---
app:
  jwt:
    secret: dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-padding
    access-token-expiration-ms: 3600000    # 1 hour for dev convenience
  fcm:
    enabled: false
  storage:
    endpoint: http://localhost:9000
